[package]
name = "vults-app"
description = "Vults: a friendly flock watching your coding agents"
authors = ["Rogerio Junior"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vults"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vults-brand.workspace = true
vults-protocol.workspace = true
vults-ipc.workspace = true
vults-core.workspace = true
vults-agents.workspace = true
vults-agent-config.workspace = true
vults-platform.workspace = true
vults-chat.workspace = true
vults-media.workspace = true
vults-voice.workspace = true
vults-store.workspace = true
vults-secrets.workspace = true
vults-connectors.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Voice on the GPU (Vulkan) on Linux: 6x to 30x faster than the CPU. Windows stays on the CPU for now.
[target.'cfg(target_os = "linux")'.dependencies]
vults-voice = { workspace = true, features = ["vulkan"] }
# Desktop notifications (org.freedesktop.Notifications): the zbus already in the tree, no new crate.
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[lints]
workspace = true

# The mock runtime: windows without a display, to test what reaches which window. Not on
# Windows: there the test binary then fails to load (STATUS_ENTRYPOINT_NOT_FOUND, no app manifest).
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }
