[package]
name = "vults-app"
description = "Vults: a friendly flock watching your coding agents"
authors = ["Rogerio Junior"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vults"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vults-brand.workspace = true
vults-protocol.workspace = true
vults-ipc.workspace = true
vults-core.workspace = true
vults-agents.workspace = true
vults-agent-config.workspace = true
vults-platform.workspace = true
vults-chat.workspace = true
vults-media.workspace = true
vults-voice = { workspace = true, features = ["meeting-assets"] }
vults-audio.workspace = true
vults-dictation.workspace = true
vults-store.workspace = true
vults-link.workspace = true
vults-relay.workspace = true
# The pairing QR, drawn by Settings from its modules: no image format, no network.
qrcode = { version = "0.14", default-features = false }
vults-zeca.workspace = true
vults-secrets.workspace = true
vults-connectors.workspace = true
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
toml_edit = "0.25"
tokio.workspace = true

# Voice on the GPU (Vulkan) on Linux: 6x to 30x faster than the CPU. Windows stays on the CPU for now.
[target.'cfg(target_os = "linux")'.dependencies]
vults-audio = { workspace = true, features = ["meeting-capture"] }
vults-voice = { workspace = true, features = ["vulkan"] }
# Desktop notifications (org.freedesktop.Notifications): the zbus already in the tree, no new crate.
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
# The Nest's window: a hidden webview marked no-show-all (the gtk already in the tree).
gtk = "0.18"

[features]
# Developer preview only; normal builds retain the diarization quality gate.
meeting-speakers = ["vults-voice/diarization"]

[lints]
workspace = true

# The mock runtime tests window ownership on the current Linux desktop target.
# Windows-linked test executables get their native-controls manifest from build.rs.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }
