[workspace]
members = ["crates/*", "app"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/rogeriojunior31/Vults"
publish = false

[workspace.dependencies]
vults-brand = { path = "crates/brand" }
vults-protocol = { path = "crates/protocol" }
vults-peer = { path = "crates/peer" }
vults-ipc = { path = "crates/ipc" }
vults-core = { path = "crates/core" }
vults-agent-config = { path = "crates/agent-config" }
vults-agents = { path = "crates/agents" }
vults-platform = { path = "crates/platform" }
vults-chat = { path = "crates/chat" }
vults-connectors = { path = "crates/connectors" }
vults-secrets = { path = "crates/secrets" }
vults-media = { path = "crates/media" }
vults-voice = { path = "crates/voice" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
libc = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

# The hook is spawned on every agent event, so it must start fast and stay small.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
