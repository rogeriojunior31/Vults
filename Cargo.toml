[workspace]
members = ["crates/*", "app"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rogeriojunior31/vultures-ai"
publish = false

[workspace.dependencies]
vultures-ai-brand = { path = "crates/brand" }
vultures-ai-protocol = { path = "crates/protocol" }
vultures-ai-peer = { path = "crates/peer" }
vultures-ai-ipc = { path = "crates/ipc" }
vultures-ai-core = { path = "crates/core" }
vultures-ai-agent-config = { path = "crates/agent-config" }
vultures-ai-agents = { path = "crates/agents" }
vultures-ai-platform = { path = "crates/platform" }
vultures-ai-chat = { path = "crates/chat" }
vultures-ai-connectors = { path = "crates/connectors" }
vultures-ai-secrets = { path = "crates/secrets" }
vultures-ai-media = { path = "crates/media" }
vultures-ai-voice = { path = "crates/voice" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
libc = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

# The hook is spawned on every agent event, so it must start fast and stay small.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
