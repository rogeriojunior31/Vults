/* PRODUCTION_THEME */
/* Design rules (open-claude-ui, adapted to Vults' pixel identity):

   - Two tab patterns: .tabs for moving between views, .segment for filters.

#vults-ui-proposal button:hover:not(:disabled) { background:var(--raised); }
#vults-ui-proposal button:focus-visible,#vults-ui-proposal select:focus-visible,#vults-ui-proposal summary:focus-visible,#vults-ui-proposal input:focus-visible { outline:2px solid var(--mark); outline-offset:2px; }

#vults-ui-proposal [data-tooltip]:hover::after { content:attr(data-tooltip); position:absolute; left:50%; top:calc(100% + 6px); transform:translateX(-50%); z-index:50; width:max-content; max-width:240px; padding:5px 8px; border-radius:6px; background:var(--raised); color:var(--fg); font:11px/1.4 var(--font); pointer-events:none; box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent); }
