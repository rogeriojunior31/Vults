<span class="del">22 −   execute(task).await</span><span class="add">22 +   let result = execute(task).await?;</span><span class="add">23 +   record_result(&result).await;</span>24  }</pre><p>Etapa concluída: edição de render.ts.</p>`:state.detail==='context'?`<dl class="facts"><dt>Repositório</dt><dd>rogeriojunior31/Vults</dd><dt>Branch</dt><dd>${s.branch}</dd><dt>Pasta</dt><dd>~/Projects/Vults</dd><dt>Editor</dt><dd>VS Code</dd><dt>Agente</dt><dd>${s.agent}</dd></dl>`:`<div class="record"><time>14:21</time><div>Leu render.ts<small>Leitura · concluída</small></div><span class="pill ok">✓</span></div><div class="record"><time>14:22</time><div>Buscou Bird<small>Busca · concluída</small></div><span class="pill ok">✓</span></div><div class="record"><time>14:24</time><div>Editando render.ts<small>2 arquivos modificados</small></div><span class="pill">Em curso</span></div>`}</section></div>${state.mode==='compact'?'<button class="compact-open" data-mode="nest">Ver alterações e contexto no Nest →</button>':''}</div>`}

function syncStudio(extra={}){

}
new ResizeObserver(()=>syncStudio()).observe(document.getElementById('app'));window.addEventListener('resize',()=>syncStudio());

  state.draft=e.data.draft;

const motion={enabled:true,active:true,onscreen:true,ticks:0,time:0,handle:0,previous:0};
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const atlasImages=Object.fromEntries(Object.entries(birdAtlas).map(([id,a])=>{const img=new Image();img.src=a.image;img.onload=()=>paintBirds();return[id,img]}));
function paintBirds(){
 for(const canvas of document.querySelectorAll('canvas[data-bird]')){
  const a=birdAtlas[canvas.dataset.bird],img=atlasImages[canvas.dataset.bird];if(!img.complete||!img.naturalWidth)continue;
  const clip=a.clips[canvas.dataset.clip]||a.clips.idle,total=clip.frames.reduce((n,f)=>n+f.ms,0);
  let time=motion.enabled&&!reducedMotion.matches?motion.time+Number(canvas.dataset.phase):1500;
  time=clip.loop?time%total:Math.min(time,total-1);
  let frame=clip.frames[clip.frames.length-1];for(const f of clip.frames){if(time<f.ms){frame=f;break}time-=f.ms}
  if(canvas.dataset.frame===String(frame.index))continue;
  canvas.width=a.width;canvas.height=a.height;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,(frame.index%a.columns)*a.width,Math.floor(frame.index/a.columns)*a.height,a.width,a.height,0,0,a.width,a.height);
  canvas.dataset.frame=String(frame.index);
 }
}
function motionTick(now){
 motion.handle=0;
 if(motion.previous&&now-motion.previous>=1000/30){motion.time+=Math.min(now-motion.previous,100);motion.previous=now;motion.ticks++;paintBirds()}
 else if(!motion.previous)motion.previous=now;
 motion.handle=requestAnimationFrame(motionTick);
}
function syncMotion(){
 if(studioReady)studioFrame.contentWindow.postMessage({type:'studio-motion',enabled:motion.enabled,active:motion.active&&motion.onscreen&&['chat','tasks'].includes(state.tab)&&state.mode!=='mini'},'*');
 const enabled=motion.enabled&&!reducedMotion.matches;
 document.body.dataset.motion=enabled?'on':'off';
 const active=enabled&&motion.active&&motion.onscreen&&!document.hidden&&!['chat','tasks'].includes(state.tab);
 if(!active&&motion.handle){cancelAnimationFrame(motion.handle);motion.handle=0;motion.previous=0}
 if(active&&!motion.handle)motion.handle=requestAnimationFrame(motionTick);
 if(!enabled)paintBirds();
}
reducedMotion.addEventListener('change',syncMotion);document.addEventListener('visibilitychange',syncMotion);
new IntersectionObserver(([entry])=>{motion.onscreen=entry.isIntersecting;syncMotion()}).observe(document.getElementById('app'));
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3200)}
function go(tab){state.roadmap=null;state.tab=tab;state.connSelected=null;render()}
function modal(title,body,onConfirm,label='Confirmar'){const d=document.getElementById('dialog');d.innerHTML=`<h2>${title}</h2>${body}<div class="btns" style="margin-top:18px"><button id="dialog-cancel">Cancelar</button><button class="primary" id="dialog-confirm">${label}</button></div>`;d.querySelector('#dialog-cancel').onclick=()=>d.close();d.querySelector('#dialog-confirm').onclick=()=>{d.close();onConfirm?.()};d.showModal();d.querySelector('#dialog-cancel').focus()}
function decide(answer){state.need=false;state.decision=answer;render();toast(answer==='deny'?'Pedido negado neste exemplo.':'Pedido permitido uma vez neste exemplo.')}
function handle(act,el){switch(act){case 'session-steps':modal('Últimas etapas','<div class="record"><time>14:22</time><div>Buscou Bird<small>Busca concluída</small></div></div><div class="record"><time>14:24</time><div>Editando render.ts<small>2 arquivos · +78 −14</small></div></div>',()=>{},'Voltar ao bando');break;case 'review':state.selected='a';go('flock');break;case 'cost':state.sub='cost';go('activity');break;case 'week':state.sub='week';go('activity');break;case 'all-settings':state.mode='nest';render();parent.postMessage({type:'vults-mode',mode:'nest'},'*');break;case 'agents':go('tasks');syncStudio({hub:'agents'});break;case 'project-settings':state.settings='projects';go('settings');break;case 'history-settings':state.settings='activity';go('settings');break;case 'connector-settings':state.settings='connectors';go('settings');break;case 'conn-back':state.connSelected=null;render();document.querySelector('.conn-list button')?.focus();break;case 'seen':state.seen.add(el.dataset.id);render();toast('Item marcado como visto.');break;case 'refresh':state.scenario='pending';render();toast('Consulta simulada concluída.');break;case 'merge':modal('Revisar merge de me/site #9','<p>Dark mode para a documentação · branch feat/dark-mode.</p><p>3 checks aprovados · revisão aprovada · método Squash.</p>',()=>{state.seen.add('9');toast('Merge simulado. Nenhuma alteração no GitHub.');render()},'Confirmar merge');break;case 'always-confirm':modal('Permitir pedidos idênticos?','<p>Claude Code · ~/Projects/Vults</p><pre>cargo test --workspace\ncargo clippy --workspace --all-targets</pre><p>A regra valerá para este comando neste projeto. Pode ser revogada em Ajustes.</p>',()=>decide('allow'),'Salvar regra');break;case 'memory':state.memory=!state.memory;render();document.querySelector(state.memory?'.memory-close':'.chat-tools [data-act=memory]')?.focus();break;case 'remember':case 'reject-memory':el.closest('article').remove();toast(act==='remember'?'Proposta de memória aceita.':'Proposta recusada.');break;case 'zeca':state.zeca=!state.zeca;if(!state.zeca&&state.tab==='chat')state.tab='flock';render();break;case 'ask-session':case 'ask-checks':state.memory=false;go('chat');syncStudio({agent:'zeca',source:{id:act==='ask-session'?'session:a':'pr:56',title:act==='ask-session'?'Vults · fix/quick-wins':'me/vults #56 · Checks failed',kind:act==='ask-session'?'session':'pull request',project:'~/Projects/Vults'},prompt:act==='ask-session'?'What is this session doing now?':'Why did these checks fail?'});break;case 'new-chat':state.chatMessages=[];state.draft='';state.scenario='empty';render();document.getElementById('draft').focus();break;case 'starter':state.draft='O que precisa de mim agora?';render();document.getElementById('draft').focus();break;case 'new-task':modal('Nova tarefa','<form id="task-form"><label>Objetivo<input id="task-title" required placeholder="O que precisa ficar pronto?"></label><label>Projeto<select id="task-project"><option>Vults</option><option>site</option><option>Sem projeto</option></select></label><label>Critérios de conclusão<textarea id="task-criteria" placeholder="Um critério por linha"></textarea></label></form>',()=>{const title=document.getElementById('task-title').value.trim();if(!title){toast('Preencha um objetivo para criar a tarefa.');return}state.addedTasks.push({id:'task-'+Date.now(),project:document.getElementById('task-project').value,title,status:'A fazer',tone:'',agent:'Você',cost:'0,00',criteria:document.getElementById('task-criteria').value.split('\n').filter(Boolean)});state.scenario='pending';go('tasks');toast('Tarefa criada neste protótipo.')},'Criar tarefa');break;case 'budget':modal('Limite diário em USD',`<p>Aplica-se a novas sessões iniciadas pelo Vults.</p><label for="budget-value">Valor em USD</label><input id="budget-value" type="number" min="0.01" step="0.01" value="${state.budget}">`,()=>{const value=Number(document.getElementById('budget-value').value);if(value>0&&value<=10000){state.budget=value;render();toast('Limite atualizado.')}else toast('Use um valor entre US$ 0,01 e US$ 10.000.')},'Salvar limite');break;case 'delete-task':modal('Excluir tarefa?','<p>A tarefa será retirada da lista deste exemplo. A sessão em andamento precisa ser parada antes de excluir seus arquivos.</p>',()=>toast('Exclusão simulada; dados de exemplo preservados.'),'Excluir tarefa');break;case 'clear-history':modal('Apagar os dados locais?','<p>Histórico de turnos, auditoria das decisões e traces do Zeca serão removidos. Esta ação não pode ser desfeita.</p>',()=>toast('Exclusão simulada. Nenhum arquivo do projeto foi alterado.'),'Apagar dados');break;case 'policy':modal('Revisar política','<p>Escopo: ~/Projects/Vults · Claude Code</p><pre>+ allow read\n+ allow command git status\n+ deny external</pre><p>Comandos destrutivos continuam exigindo sua decisão.</p>',()=>toast('Política aceita neste exemplo.'),'Aceitar política');break;case 'revoke':modal('Revogar regra permanente?','<p>git status volta a pedir permissão neste projeto.</p>',()=>toast('Regra revogada neste exemplo.'),'Revogar');break;case 'engine':modal('Motor da conversa','<p>Claude Code · conectado</p><p>Codex · configure em Ajustes → Agentes</p><p>A escolha se aplica à próxima conversa.</p>',()=>toast('Claude Code mantido como motor.'),'Usar Claude');break;case 'pair':modal('Parear seu telefone','<p>Ative o telefone e salve o endereço da conexão antes de gerar o código.</p><p>O código de pareamento tem validade de dois minutos.</p>',()=>toast('Fluxo de pareamento demonstrado; nenhum dispositivo conectado.'),'Entendi');break;case 'palette':modal('Buscar no Vults','<label for="palette-query">Sessão ou área</label><input id="palette-query" type="search" placeholder="Vults, Tarefas, Conexões…"><div class="btns" style="margin-top:10px"><button data-dialog-tab="flock">Vults · aguarda você</button><button data-dialog-tab="tasks">Tarefas</button><button data-dialog-tab="connections">Conexões</button></div>',()=>{},'Fechar');document.querySelectorAll('[data-dialog-tab]').forEach(b=>b.onclick=()=>{document.getElementById('dialog').close();go(b.dataset.dialogTab)});break;case 'clear-search':state.query='';render();break;case 'export':{const c=document.createElement('canvas');c.width=1000;c.height=480;const x=c.getContext('2d');x.fillStyle='#101719';x.fillRect(0,0,1000,480);x.fillStyle='#e5eadc';x.font='36px system-ui';x.fillText('vults / sua semana',60,90);x.font='24px system-ui';x.fillText('5–11 out 2026 · dados de exemplo',60,140);x.font='32px system-ui';x.fillText('6h 20     41 turnos     +1.217 −312     21 decisões',60,260);x.font='18px system-ui';x.fillStyle='#a5afb5';x.fillText('Contagens locais · nomes dos projetos ocultos',60,385);const a=document.createElement('a');a.download='vults-proposta-resumo.png';a.href=c.toDataURL();a.click();toast('Imagem do resumo exportada.');break;}case 'copy-command':case 'copy-path':{const value=act==='copy-path'?'~/.config/vults/settings.json':'gh pr checks 56 --repo me/vults';navigator.clipboard?.writeText(value).then(()=>toast('Copiado.'),()=>toast('Comando: '+value));break;}case 'attach':toast('Exemplo: arquivo anexado à próxima mensagem.');break;default:toast({'terminal':'Neste produto, esta ação abre o terminal da sessão.','github':'Neste produto, esta ação abre o item no GitHub.','stop-task':'A sessão seria parada; a tarefa permanece disponível.','review-task':'Revisão solicitada neste exemplo.','handoff-task':'O agente prepara um pacote de contexto antes da transferência.','issue':'A issue seria aberta no navegador.','save-key':'Chave simulada salva. Não informe chaves reais neste protótipo.','agent-diff':'A configuração é revisada por diff antes de aplicar.','remove-hooks':'A remoção usa o mesmo fluxo de diff e backup.','project-pr':'Abra Conexões para ver os pull requests do projeto.','previous-week':'Exemplo limitado à semana de 5–11 de outubro.','recent-chat':'Conversa de exemplo selecionada.'}[act]||'Ajuste aplicado neste exemplo.') }}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.roadmapAction){roadmapAction(b.dataset.roadmapAction,b)}else if(b.dataset.tab){go(b.dataset.tab);document.querySelector(`[data-tab="${state.tab}"]`).focus()}else if(b.dataset.mode){state.mode=b.dataset.mode;render();parent.postMessage({type:'vults-mode',mode:state.mode},'*')}else if(b.dataset.sub){state.sub=b.dataset.sub;state.recordQuery='';render();document.querySelector(`[data-sub="${state.sub}"]`).focus()}else if(b.dataset.session){state.selected=b.dataset.session;render();document.querySelector(`[data-session="${state.selected}"]`)?.focus()}else if(b.dataset.detail){state.detail=b.dataset.detail;render();document.querySelector(`[data-detail="${state.detail}"]`).focus()}else if(b.dataset.conn){state.conn=b.dataset.conn;state.connSelected=null;render();document.querySelector(`[data-conn="${state.conn}"]`).focus()}else if(b.dataset.connRow){state.connSelected=b.dataset.connRow;render();document.querySelector('.conn-detail').focus();document.querySelector('.conn-detail').scrollIntoView({block:'start'})}else if(b.dataset.settingsPage){state.settings=b.dataset.settingsPage;go('settings')}else if(b.dataset.decision){decide(b.dataset.decision)}else if(b.dataset.day){state.day=Number(b.dataset.day);render();document.querySelector(`[data-day="${state.day}"]`).focus()}else if(b.dataset.act){handle(b.dataset.act,b)}});
document.addEventListener('input',e=>{if(e.target.id==='draft')state.draft=e.target.value;if(e.target.dataset.search){const q=e.target.value,key=e.target.dataset.search==='tasks'?'query':'recordQuery',start=e.target.selectionStart;state[key]=q;render();const fresh=document.querySelector(`[data-search="${e.target.dataset.search}"]`);fresh.focus();fresh.setSelectionRange(start,start)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.taskFilter){state.taskFilter=t.value;render()}if(t.dataset.settingsSelect!==undefined){state.settings=t.value;render()}if(t.dataset.setting){state.settingsValues[t.dataset.setting]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.setting==='zeca'){state.zeca=t.checked;render()}toast('Ajuste salvo neste exemplo.')}if(t.dataset.criterion!==undefined){state.checks[Number(t.dataset.criterion)]=t.checked;render()}if(t.dataset.repo!==undefined){state.connRepo=t.value;state.connSelected=null;render()}if(t.dataset.taskStatus!==undefined){state.taskOverrides[t.dataset.taskStatus]={status:{todo:'A fazer',doing:'Em andamento',review:'Em revisão',done:'Concluída'}[t.value]};render();toast('Status atualizado neste exemplo.') }});
function send(){const text=state.draft.trim();if(!text)return;state.chatMessages.push({who:'you',text},{who:'zeca',text:'Mensagem recebida neste protótipo. A conversa real usa o motor escolhido e pede permissão antes de agir.'});state.draft='';state.scenario='pending';render();document.getElementById('draft').focus()}
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='chat-form')send()});
document.addEventListener('keydown',e=>{if(e.target.id==='draft'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}const b=e.target.closest('.topnav [role=tab]');if(b&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const visible=tabs.filter(([id])=>id!=='chat'||state.zeca);let i=visible.findIndex(([id])=>id===state.tab);i=e.key==='Home'?0:e.key==='End'?visible.length-1:(i+(e.key==='ArrowRight'?1:-1)+visible.length)%visible.length;go(visible[i][0]);document.querySelector(`[data-tab="${state.tab}"]`).focus()}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();handle('palette')}if(e.altKey&&/^[1-5]$/.test(e.key)){e.preventDefault();const visible=tabs.filter(([id])=>id!=='settings'&&(id!=='chat'||state.zeca));if(visible[Number(e.key)-1])go(visible[Number(e.key)-1][0])}if(e.key==='Escape'&&state.memory&&!document.getElementById('dialog').open){state.memory=false;render();document.querySelector('[data-act=memory]').focus()}});
window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(d.type==='vults-motion'){motion.enabled=d.enabled;motion.active=d.active;syncMotion()}if(d.type==='vults-mode-set'){state.mode=d.mode;render()}if(d.type==='vults-scenario'){state.scenario=d.scenario;state.need=['pending','destructive','stale'].includes(d.scenario);motion.time=0;state.selected='a';state.decision=null;render()}if(d.type==='vults-open'){state.tab=d.tab||state.tab;if(d.sub)state.sub=d.sub;if(d.settings)state.settings=d.settings;if(d.conn)state.conn=d.conn;state.mode=d.mode||state.mode;render()}});
__ROADMAP_SCRIPT__
window.vultsDemo={state,render,motion,openRoadmap,studioReady:()=>studioReady,openStudio:(hub,section)=>{go('tasks');syncStudio({hub,section,feature:null})}};render();syncMotion();
</script>
