# Fuzzing (plan-zeca S5): what reaches the app from outside. The hook's own road (an agent's stdin,
# the event it builds, the line on the socket, the parser, the core), the app's reply the hook
# reads, any agent's hook JSON in sequence, and the audit log's redactor. Weekly, ten minutes a
# target, from a corpus seeded by the agents' recorded payloads and kept between runs. A crash
# fails the run and its input is kept as an artifact:
# `cargo +$NIGHTLY fuzz run <target> <file>` replays it.
name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "scripts/fuzz-corpus.sh"
      - "crates/protocol/**"
      - "crates/agents/**"
      - "crates/core/**"
      - "crates/hook/**"

permissions:
  contents: read

env:
  # Dated, so a crash from CI replays the same locally.
  NIGHTLY: nightly-2026-10-09
  CARGO_FUZZ: 0.13.2

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [hook_event, agent_event, decode_event, reply, redact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      # Before the install, so cargo-fuzz comes from the cache after the first run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          cache-bin: true
      - name: cargo-fuzz
        run: cargo "+$NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ" --locked
      - name: Corpus from the last run
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed the corpus
        run: scripts/fuzz-corpus.sh
      - name: Fuzz
        working-directory: fuzz
        env:
          # A pull request only checks the targets still build and run.
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '30' || '600' }}
        run: cargo "+$NIGHTLY" fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=$SECONDS_PER_TARGET
      - name: Keep the crash
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/
