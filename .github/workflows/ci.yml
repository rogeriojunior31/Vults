name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries (WebKitGTK, layer-shell, tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev cmake libvulkan-dev glslc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app embeds ui/dist at compile time.
      - name: ui
        run: |
          npm ci
          npm run build
      # rustup reads rust-toolchain.toml on the first cargo call.
      - uses: Swatinem/rust-cache@v2
      # Same sequence as CLAUDE.md.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: release hook builds
        run: cargo build --release -p vultures-ai-hook

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: brand
        run: scripts/check-brand.sh
      - name: english
        run: scripts/check-english.sh
      - name: versions
        run: scripts/check-version.sh
      - name: scripts
        # One file per call: `bash -n a.sh b.sh` checks only a.sh.
        run: for f in scripts/*.sh; do bash -n "$f"; done
