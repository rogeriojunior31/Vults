name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries (WebKitGTK, layer-shell, tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libpulse-dev cmake libvulkan-dev glslc \
            hyperfine libclang-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The app embeds ui/dist at compile time.
      - name: ui
        shell: bash
        run: |
          npm ci
          npm run build
          node scripts/check-island-geometry.mjs
          node scripts/check-record-search.mjs
          node scripts/check-nest-close.mjs
          node scripts/check-chat-models.mjs
          node scripts/check-flock-place.mjs
          node scripts/check-settings-ui.mjs
          node scripts/check-meeting-summary.mjs
          node scripts/check-dictation-words.mjs
          node scripts/check-dictation-statistics.mjs
          node scripts/check-dictation-diagnostics.mjs
          node scripts/check-dictation-history.mjs
          node scripts/check-dictation-island.mjs
          node scripts/check-dictation-status.mjs
          node scripts/check-dictation-styles.mjs
          node scripts/check-meeting-assets.mjs
          node scripts/check-project-search.mjs
          node scripts/check-surface-continuity.mjs
          node scripts/check-text-questions.mjs
      # rustup reads rust-toolchain.toml on the first cargo call.
      - uses: Swatinem/rust-cache@v2
      # Same sequence as CLAUDE.md.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: meeting capture spike (no microphone or system stream)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p vults-audio --features meeting-capture --all-targets -- -D warnings
          cargo test -p vults-audio --features meeting-capture
      - name: offline speech backends (no models, runtime or audio downloads)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p vults-voice -p vults-spike --features vults-voice/semantic-turn,vults-spike/diarization,vults-spike/meeting-assets --all-targets -- -D warnings
          cargo test -p vults-voice --features diarization,meeting-assets,semantic-turn
          cargo test -p vults-spike --features diarization --bin vults-diarization-spike
          cargo clippy -p vults-app --features meeting-speakers --all-targets -- -D warnings
          cargo test -p vults-app --features meeting-speakers
      - name: release hook builds
        run: cargo build --release -p vults-hook
      # The evals (crates/evals): policy, redaction, the prompts sent to models, injection.
      - name: evals
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p vults-evals --features evals --all-targets -- -D warnings
          cargo test -p vults-evals --features evals
      - name: hook cold start
        if: runner.os == 'Linux'
        run: scripts/check-hook-start.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: brand
        run: scripts/check-brand.sh
      - name: english
        run: scripts/check-english.sh
      - name: translations
        run: scripts/check-i18n.sh
      - name: readme translation
        run: scripts/check-readme-pt-br.sh
      - name: versions
        run: scripts/check-version.sh
      - name: layers
        run: scripts/check-layers.sh
      - name: network
        run: scripts/check-network.sh --self-test && scripts/check-network.sh
      - name: scripts
        # One file per call: `bash -n a.sh b.sh` checks only a.sh.
        run: for f in scripts/*.sh; do bash -n "$f"; done
