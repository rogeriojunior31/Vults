# On a version tag, builds the packages and attaches them to a *draft* GitHub release.
# Nothing is published until someone reviews the draft and clicks Publish. Its notes are the
# version's section of CHANGELOG.md (check-version.sh refuses a tag without one).
#
# A `version` job goes first: a tag that is not the version in every file stops the run.
# Then two jobs on purpose: `build` runs npm and cargo with a read-only
# token; only `publish`, which runs none of that code, may write to the repository.
# A pull request that touches the packaging builds everything and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/tauri.bundle.*.json"

permissions:
  contents: read

jobs:
  # First, before any build: a tag that is not the version in every file stops the release.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the version
        # A pull request has no tag: only the three files are compared.
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: scripts/check-version.sh "$TAG"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # .deb and .rpm link the system's libraries: built on the oldest Ubuntu we support,
          # so they install on its glibc 2.35 and anything newer.
          - name: linux-packages
            os: ubuntu-22.04
            script: bundle:linux
            bundles: deb,rpm
            files: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm
          # No AppImage for now: its build was the slowest by far. To bring it back, a
          # linux-appimage entry on ubuntu-24.04 (bundles: appimage) and its GStreamer plugins.
          - name: windows
            os: windows-latest
            script: bundle:windows
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev cmake libvulkan-dev patchelf
      - name: glslc
        if: runner.os == 'Linux' && matrix.os != 'ubuntu-22.04'
        run: sudo apt-get install -y glslc
      # 22.04 has no glslc and older Vulkan headers than whisper.cpp builds with: both come from
      # LunarG's SDK, pinned and checked. The loader library stays the system's.
      - name: Vulkan SDK (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        env:
          VK_VERSION: 1.4.363.0
          VK_SHA256: 197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o vksdk.tar.xz "https://sdk.lunarg.com/sdk/download/$VK_VERSION/linux/vulkansdk-linux-x86_64-$VK_VERSION.tar.xz"
          echo "$VK_SHA256  vksdk.tar.xz" | sha256sum -c -
          tar -xJf vksdk.tar.xz "$VK_VERSION/x86_64/bin" "$VK_VERSION/x86_64/include"
          rm vksdk.tar.xz
          echo "VULKAN_SDK=$PWD/$VK_VERSION/x86_64" >> "$GITHUB_ENV"
          echo "$PWD/$VK_VERSION/x86_64/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: npm ci
      - name: Build the packages
        run: npm run ${{ matrix.script }} -- --bundles ${{ matrix.bundles }}
      - name: Collect them
        shell: bash
        run: mkdir dist-packages && cp ${{ matrix.files }} dist-packages/ && ls -l dist-packages
      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.name }}
          path: dist-packages/*
          retention-days: 3

  publish:
    needs: build
    # Checked here too, so a pull request never gets this far whatever the build reports.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: an OIDC token to sign it, and the right to store the attestation.
      id-token: write
      attestations: write
    steps:
      # Only CHANGELOG.md is read here: the notes are its section for this version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Release notes
        # The section under "## X.Y.Z (date)", up to the next one; relative links point at the tag.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md |
            sed -E "s#\]\((docs/|LICENSE|NOTICE)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1#g" > notes.md
          printf '\nCheck a download with: `sha256sum -c SHA256SUMS --ignore-missing`\n' >> notes.md
          printf 'and where it was built with: `gh attestation verify <file> --repo %s`\n' "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      # GitHub stores "My App_0.1.0.deb" as "My.App_0.1.0.deb" (0.1.x was "Vultures AI"): rename first, so the
      # names in SHA256SUMS are the ones users download (0.1.0 shipped with mismatched names).
      - name: Asset names
        run: cd release && for f in *' '*; do [ -e "$f" ] && mv -- "$f" "${f// /.}"; done; ls
      # After the merge, so one file covers every package.
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Signed proof that each package came from this workflow at this tag (Sigstore, stored on
      # GitHub), checked with `gh attestation verify`. Before ADR 0016's own signatures.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Vults $GITHUB_REF_NAME" --notes-file notes.md
