# On a version tag, builds the packages and attaches them to a *draft* GitHub release.
# Nothing is published until someone reviews the draft and clicks Publish.
#
# Two jobs on purpose: `build` runs npm, cargo and the AppImage tooling with a read-only token;
# only `publish`, which runs none of that code, may write to the repository.
# A pull request that touches the packaging builds everything and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/tauri.bundle.*.json"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # .deb and .rpm link the system's libraries: built on the oldest Ubuntu we support,
          # so they install on its glibc 2.35 and anything newer.
          - name: linux-packages
            os: ubuntu-22.04
            script: bundle:linux
            bundles: deb,rpm
            files: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm
          # The AppImage carries its own GTK and WebKitGTK: built on 24.04 they are recent enough
          # for rolling distributions. It needs glibc 2.39 or newer.
          - name: linux-appimage
            os: ubuntu-24.04
            script: bundle:linux
            bundles: appimage
            files: target/release/bundle/appimage/*.AppImage
          - name: windows
            os: windows-latest
            script: bundle:windows
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: npm ci
      - name: Build the packages
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE, so it unpacks itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run ${{ matrix.script }} -- --bundles ${{ matrix.bundles }}
      - name: Collect them
        shell: bash
        run: mkdir dist-packages && cp ${{ matrix.files }} dist-packages/ && ls -l dist-packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist-packages/*
          retention-days: 3

  publish:
    needs: build
    # Checked here too, so a pull request never gets this far whatever the build reports.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      # After the merge, so one file covers every package.
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # A block: the notes' "Draft: …" would end a plain YAML scalar at its colon.
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Vultures AI $GITHUB_REF_NAME" \
            --notes "Draft: review the packages, then publish. Check a download with: sha256sum -c SHA256SUMS --ignore-missing"
