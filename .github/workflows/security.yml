name: Security

# Known vulnerabilities, licenses and crate sources (deny.toml), npm advisories, and secrets in
# the history. On the PRs that change dependencies, and every Monday for advisories published
# since the last change.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - package-lock.json
      - package.json
      - .github/workflows/security.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release binary, pinned by hash: the action builds a Docker image, and Docker Hub's
      # anonymous pull limit (429) fails it on shared runners.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  deny.tar.gz" | sha256sum -c -
          tar xzf deny.tar.gz
          install -m 755 "$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          rm -rf deny.tar.gz "$name"
      - run: cargo deny --locked check advisories bans licenses sources

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
