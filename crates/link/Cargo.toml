[package]
name = "vults-link"
description = "The phone's link (ADR 0004): pairing by QR, sealed envelopes, signed answers for core's ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vults-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# X25519 between desktop and phone, HKDF-SHA256 over it, and XChaCha20-Poly1305 to seal what goes
# through the relay (random 24-byte nonces never repeat in practice).
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.13"
sha2 = "0.10"
# What an Android Keystore key signs with: ECDSA on P-256 (SHA256withECDSA, DER signatures).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[lints]
workspace = true
