[package]
name = "vults-evals"
description = "Evals with cassettes: policy, redaction, the prompts sent to models, injection (plan-zeca S7)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `cargo test -p vults-evals --features evals`: off by default, so `cargo test --workspace` stays
# as it was; CI runs them on their own.
[features]
evals = []

[dependencies]
vults-core.workspace = true
vults-chat.workspace = true
vults-zeca.workspace = true
vults-store.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
vults-dictation.workspace = true

[lints]
workspace = true
