[package]
name = "vults-hook"
description = "Relays Claude Code and Codex hook events to Vults"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vults-hook"
path = "src/main.rs"

[dependencies]
vults-brand.workspace = true
vults-protocol.workspace = true
vults-peer.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Only to check the sidecar name matches the installer's; the binary stays std + serde_json.
vults-agent-config.workspace = true
vults-ipc.workspace = true
tokio.workspace = true

[lints]
workspace = true
