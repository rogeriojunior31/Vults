[package]
name = "vultures-ai-platform"
description = "Per-OS window placement for the island: layer-shell on Wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vultures-ai-brand.workspace = true
vultures-ai-protocol.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# Only to hand the island back to the compositor: the safe API cannot unset a monitor.
gtk-layer-shell-sys = "0.7"
# The tray item: our own StatusNotifierItem, so a left click reaches the app (zbus 5, already here).
ksni = "0.3"
png = "0.18"

[lints]
workspace = true
