[package]
name = "vults-relay"
description = "The phone's relay (ADR 0004): stores and forwards sealed envelopes it cannot read; and its client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The relay knows only the link's limits and wire names (plan-zeca G1: link and protocol, nothing else).
[dependencies]
vults-link.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tower-http = { version = "0.6", default-features = false, features = ["timeout"] }
# The client: the desktop's requests go out only through the app's network gate (ADR 0019).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }

[dev-dependencies]
vults-core.workspace = true
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
