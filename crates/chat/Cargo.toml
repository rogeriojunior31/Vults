[package]
name = "vults-chat"
description = "Chat through the agents' official CLIs (the user's own subscription) or an API key"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["process"] }
unicode-normalization = "0.1"
vults-secrets.workspace = true
vults-agents.workspace = true
vults-protocol.workspace = true
vults-core.workspace = true
vults-dictation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
