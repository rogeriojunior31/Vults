# cargo deny check: known vulnerabilities, licenses, where crates come from.
# Runs in .github/workflows/security.yml; locally: cargo install cargo-deny && cargo deny check.

[graph]
all-features = true

[advisories]
# Informational retirement advisories held by the desktop dependency stack.
# Tauri 2 and layer-shell still require GTK3 until Tauri moves to GTK4.
ignore = [
  { id = "RUSTSEC-2024-0422", reason = "gtk-layer-shell (GTK3): no GTK4 Tauri yet" },
  { id = "RUSTSEC-2024-0423", reason = "gtk-layer-shell-sys (GTK3): no GTK4 Tauri yet" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, build-time only, pulled in by the GTK3 bindings" },
  # These crates merged into zbus 6; remove once Tauri/ashpd/ksni have migrated from zbus 5.
  { id = "RUSTSEC-2026-0370", reason = "zvariant retired into zbus 6; required by the existing zbus 5 desktop stack" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names retired into zbus 6; required by the existing zbus 5 desktop stack" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive retired into zbus 6; required by the existing zbus 5 desktop stack" },
]

[licenses]
# Permissive licenses, plus MPL-2.0 (copyleft per file, fine in an MIT app).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

# Arboard's Windows-only dependencies: reviewed permissive Boost license, scoped to these versions.
[[licenses.exceptions]]
name = "clipboard-win"
version = "=5.4.3"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
version = "=3.4.0"
allow = ["BSL-1.0"]

# Reviewed permissive decompressor license; retain its unmodified notice in meeting assets.
[[licenses.exceptions]]
name = "libbz2-rs-sys"
version = "=0.2.5"
allow = ["bzip2-1.0.6"]

[bans]
# Tauri's tree carries many duplicate versions; flagging them would only be noise.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
